<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-labelledby="title desc">
  <title id="title">Hamrick Fence Co. logo</title>
  <desc id="desc">A yellow roadside-sign style logo with bold black lettering and a simple fence icon.</desc>
  <rect width="560" height="160" rx="20" fill="#FFD100" />
  <rect x="6" y="6" width="548" height="148" rx="16" fill="none" stroke="#1A1A1A" stroke-width="12" />
  <g fill="#1A1A1A">
    <rect x="34" y="34" width="16" height="54" rx="6" />
    <rect x="62" y="24" width="16" height="64" rx="6" />
    <rect x="90" y="34" width="16" height="54" rx="6" />
    <rect x="32" y="48" width="80" height="10" rx="5" />
    <rect x="32" y="70" width="80" height="10" rx="5" />
  </g>
  <text x="136" y="74" fill="#1A1A1A" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="52" letter-spacing="2">HAMRICK</text>
  <text x="136" y="126" fill="#1A1A1A" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="42" letter-spacing="2">FENCE CO.</text>
</svg>
